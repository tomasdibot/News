{% if push_key %}
<dialog id="pushdlg">
  <p id="pushmsg"></p>
  <div id="pushcode" hidden>
    <textarea id="pushtext" readonly></textarea>
    <div class="row">
      <button type="button" class="primary" id="pushcopy">{{ ui.push_copy }}</button>
      {% if repo %}<a href="https://github.com/{{ repo }}/settings/secrets/actions" target="_blank" rel="noopener">{{ ui.push_open_github }}</a>{% endif %}
    </div>
  </div>
  <div class="row"><button type="button" id="pushclose">{{ ui.push_done }}</button></div>
</dialog>
<script>
(function () {
  var KEY = {{ push_key|tojson }}, T = {{ ui|tojson }};
  var bell = document.getElementById("bell"), dlg = document.getElementById("pushdlg");
  var msg = document.getElementById("pushmsg"), codeBox = document.getElementById("pushcode");
  var text = document.getElementById("pushtext"), copyBtn = document.getElementById("pushcopy");
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  var supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  function b64url(buf) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function keyBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
  }
  function show(message, code) {
    msg.textContent = message;
    codeBox.hidden = !code;
    if (code) { text.value = code; copyBtn.textContent = T.push_copy; }
    if (dlg.showModal) dlg.showModal(); else alert(message);
  }
  function setOn(on) {
    bell.classList.toggle("on", on);
    bell.title = on ? T.bell_on : T.bell_off;
    bell.setAttribute("aria-label", bell.title);
  }
  function codeFor(sub) {
    var j = sub.toJSON();
    return b64url(new TextEncoder().encode(JSON.stringify({ endpoint: j.endpoint, keys: j.keys })));
  }
  function ready() {
    // If the app's background worker failed to install, .ready never settles: don't hang silently.
    return Promise.race([navigator.serviceWorker.ready, new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error("service worker not available, reload the app and try again")); }, 10000);
    })]);
  }
  function current() {
    return ready().then(function (reg) {
      return reg.pushManager.getSubscription().then(function (sub) {
        // A new password means a new sender key: the old subscription can't be used.
        if (sub && sub.options && sub.options.applicationServerKey &&
            b64url(sub.options.applicationServerKey) !== KEY) {
          return sub.unsubscribe().then(function () { return null; });
        }
        return sub;
      });
    });
  }

  if (supported || isIOS) bell.hidden = false;
  if (supported && Notification.permission === "granted") {
    current().then(function (sub) { setOn(!!sub); }).catch(function () {});
  }

  bell.addEventListener("click", function () {
    if (!supported) { show(isIOS && !standalone ? T.push_ios : T.push_unsupported); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm !== "granted") { show(T.push_denied); return; }
      return current().then(function (sub) {
        return sub || ready().then(function (reg) {
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(KEY) });
        });
      }).then(function (sub) {
        setOn(true);
        show(T.push_off_hint + " " + T.push_step1, codeFor(sub));
      });
    }).catch(function (e) { show(T.push_failed.replace("{err}", (e && e.message) || e)); });
  });

  copyBtn.addEventListener("click", function () {
    var done = function () { copyBtn.textContent = T.push_copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text.value).then(done, function () { text.select(); document.execCommand("copy"); done(); });
    } else { text.select(); document.execCommand("copy"); done(); }
  });
  document.getElementById("pushclose").addEventListener("click", function () { dlg.close(); });
})();
</script>
{% endif %}
