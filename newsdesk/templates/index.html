<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
{% include "_app_head.html" %}
<meta name="referrer" content="no-referrer">
<title>{{ cfg.site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:wght@700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Libre+Franklin:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- A printed newspaper: ivory paper, near-black ink, hairline rules ---- */
:root {
  --bg: #f4efe4; --card: #fbf8f1; --ink: #171512; --muted: #6a6358; --line: #d6cdbd; --rule: #171512;
  --accent: #8a1c1c; --chip: #ebe4d6; --local: #1d4e72;
  --mast: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
  --head: "Playfair Display", Georgia, "Times New Roman", serif;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151411; --card: #1c1a17; --ink: #ece6da; --muted: #a39b8d; --line: #3a362f; --rule: #ece6da;
          --accent: #e0857a; --chip: #2a2723; --local: #8fc0e4; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--serif);
       -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* App shell: masthead + section bar fixed, the paper fills the rest and swipes sideways. */
.app { height: 100vh; height: 100dvh; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
header { padding: 6px 14px 0; flex: none; }
.masthead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
header h1 { grid-column: 2; font: 400 34px/1.05 var(--mast); margin: 0; letter-spacing: .3px; text-align: center;
            white-space: nowrap; }
.actions { display: flex; gap: 2px; justify-self: end; grid-column: 3; }
.actions.left { justify-self: start; grid-column: 1; grid-row: 1; }
.refresh { width: 38px; height: 38px; border: 0; border-radius: 50%; background: none; color: var(--ink);
           font-size: 19px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.refresh[hidden] { display: none; }
.refresh.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bell.on { background: var(--ink); color: var(--bg); }
.bell.on path { fill: currentColor; }
.dateline { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; padding: 4px 0 3px;
            border-top: 1px solid var(--rule); border-bottom: 3px double var(--rule);
            font: 600 10.5px/1.3 var(--sans); letter-spacing: .05em; white-space: nowrap; text-transform: uppercase; color: var(--ink); }
.dateline time { font-weight: 500; }

.tabs { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 8px;
        border-bottom: 1px solid var(--rule); -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 9px 9px 7px; font: 600 12px/1 var(--sans);
       letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
       border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
         scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.pager::-webkit-scrollbar { display: none; }
.panel { flex: 0 0 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto;
         overscroll-behavior-y: contain; padding: 10px 14px calc(24px + env(safe-area-inset-bottom)); }

/* Stories. Tap one to open its summary and sources. */
.card { overflow: hidden; }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.kick { font: 600 10.5px/1.3 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
        display: flex; flex-wrap: wrap; gap: 0 6px; white-space: nowrap; }
.kick > * { flex: none; }
.kick > * + *::before { content: "·"; margin-right: 6px; color: var(--muted); }
.kick .t { color: var(--accent); }
.kick .loc { color: var(--local); }
.kick .single { color: var(--accent); }
.row h3 { font: 700 16.5px/1.22 var(--head); margin: 0; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
.card.open .row h3 { -webkit-line-clamp: unset; }
img { filter: saturate(.85) contrast(1.04); }

/* The 4 most important stories, all with the same weight; hairline rules between them. */
.briefs { display: grid; grid-template-columns: 1fr; border-top: 3px double var(--rule); }
.card.brief { border-bottom: 1px solid var(--line); padding: 12px 0; }
.card.brief .row { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 12px; align-items: start; }
.card.brief .kick { margin-bottom: 4px; }
.card.brief .row h3 { font: 800 19px/1.18 var(--head); -webkit-line-clamp: 3; letter-spacing: -.1px; }
.card.brief .lede { margin: 5px 0 0; font: italic 400 14px/1.38 var(--serif); opacity: .85;
                    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.brief.open .lede { display: none; }
.thumb { width: 88px; height: 88px; background: var(--chip); overflow: hidden; position: relative; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 640px) {
  .briefs { grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .card.brief .row { grid-template-columns: minmax(0, 1fr) 120px; }
  .thumb { width: 120px; height: 100px; }
}
.card.brief.extra { display: none; }
.panel.expanded .card.brief.extra { display: block; }
.moreall { display: block; width: 100%; min-height: 44px; margin-top: 10px; background: none; cursor: pointer;
           border: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
           font: 700 11.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.more { display: none; padding: 8px 0 4px; }
.card.open .more { display: block; }
.more p { margin: 0 0 8px; font: 400 15px/1.5 var(--serif); }
.ai { font: italic 12.5px/1.3 var(--serif); color: var(--muted); margin-bottom: 6px; }
.cov { font: 600 10.5px/1.3 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.srcs { display: flex; flex-wrap: wrap; gap: 0 4px; margin-bottom: 10px; font: 14px/1.9 var(--serif); }
.srcs a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; padding: 4px 0; }
.srcs a + a::before { content: "· "; color: var(--muted); }
.read { display: flex; align-items: center; justify-content: center; min-height: 44px; border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none;
        font: 700 11.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.empty { color: var(--muted); padding: 40px 8px; text-align: center; font-style: italic; }

/* Dialogs (settings + notifications) */
dialog { border: 1px solid var(--rule); border-radius: 4px; background: var(--card); color: var(--ink);
         width: min(460px, calc(100vw - 24px)); padding: 18px; max-height: calc(100dvh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog p { margin: 0 0 12px; }
dialog h2 { font: 800 22px var(--head); margin: 0 0 6px; outline: none; }
dialog h3 { font: 600 15px var(--sans); margin: 18px 0 8px; }
dialog .hint { color: var(--muted); font-size: 13px; }
dialog textarea { width: 100%; height: 96px; font: 12px/1.4 ui-monospace, monospace; padding: 8px; border-radius: 8px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: none; }
dialog input[type=text] { width: 100%; font: inherit; font-size: 16px; min-height: 44px; padding: 8px 10px; margin-bottom: 8px;
                          border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
dialog .row2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
dialog .row2 > * { flex: 1 1 auto; min-height: 44px; border-radius: 8px; font: 600 15px var(--sans);
                   display: grid; place-items: center; text-decoration: none; border: 1px solid var(--line);
                   background: var(--chip); color: var(--ink); cursor: pointer; padding: 0 12px; }
dialog .row2 > .primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* keep the old class name used by the notification dialog */
dialog .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; grid-template-columns: none; padding: 0; }
dialog .row > * { flex: 1 1 auto; min-height: 44px; border-radius: 8px; font: 600 15px var(--sans);
                  display: grid; place-items: center; text-decoration: none; border: 1px solid var(--line);
                  background: var(--chip); color: var(--ink); cursor: pointer; padding: 0 12px; }
dialog .row > .primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tlist li { display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; border-top: 1px solid var(--line); min-height: 46px; }
.tlist li:first-child { border-top: 0; }
.tlist label { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.tlist input[type=checkbox], .switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.tlist li.off label span { color: var(--muted); }
.tlist .mv { width: 40px; height: 40px; border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; border-radius: 8px; }
.tlist .mv:disabled { opacity: .25; }
.aibox { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.aibox textarea { width: 100%; margin: 6px 0; font: 13px/1.4 var(--sans); background: var(--card); color: var(--ink);
                  border: 1px solid var(--line); border-radius: 2px; padding: 6px; }
.aibox button { width: 100%; min-height: 44px; border-radius: 8px; font: 600 15px var(--sans); cursor: pointer;
                border: 1px solid var(--line); background: var(--chip); color: var(--ink); }
.aibox.on textarea, .aibox.on button { display: none; }
.switch { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.about { color: var(--muted); font-size: 12.5px; margin-top: 16px; }
.addrow { display: flex; gap: 8px; }
.addrow input[type=text] { flex: 1; margin: 0; }
.addrow button { flex: none; min-height: 44px; border-radius: 8px; border: 0; padding: 0 16px; font: 600 15px var(--sans);
                 background: var(--ink); color: var(--bg); cursor: pointer; }
.tlist { margin-top: 12px; }
.tl { flex: 1; display: flex; flex-direction: column; min-height: 44px; justify-content: center; }
.tlist li.ed { display: block; padding: 8px 12px 12px; background: var(--bg); }
.tlist li.ed label { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
.tlist li.ed input[type=text] { margin: 4px 0 4px; }
.tlist li.ed select { width: 100%; min-height: 44px; font: inherit; font-size: 16px; border-radius: 8px;
                      border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0 10px; }
.tl small { color: var(--muted); font-size: 12px; }
.picklabel { display: block; font: 600 15px var(--sans); margin: 18px 0 8px; }
#pick { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 8px 36px 8px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg); color: var(--ink); -webkit-appearance: none; appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
        margin-bottom: 8px; }
.pick { background: var(--card); border: 1px solid var(--rule); border-radius: 0; padding: 14px; margin-bottom: 10px; }
.pick p { margin: 0 0 10px; }
.pickbtn { width: 100%; border: 0; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="masthead">
      <div class="actions left">
        {% if push_key %}<button class="refresh bell" id="bell" type="button" aria-label="{{ ui.bell_off }}" title="{{ ui.bell_off }}" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>{% endif %}
      </div>
      <h1>{{ cfg.site.title }}</h1>
      <div class="actions">
        <button class="refresh" id="gear" type="button" aria-label="{{ ui.settings }}" title="{{ ui.settings }}">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="refresh" id="refresh" type="button" aria-label="{{ ui.refresh }}" title="{{ ui.refresh }}">↻</button>
      </div>
    </div>
    <div class="dateline"><span id="today"></span><span>{{ ui.updated }} <time class="rel" datetime="{{ e.generated_at }}">{{ e.generated_local }}</time></span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="pager" id="pager"></main>
</div>

<dialog id="setdlg">
  <h2 tabindex="-1" autofocus>{{ ui.themes_title }}</h2>
  <p class="hint">{{ ui.themes_hint }}</p>
  <form class="addrow" id="addform">
    <input type="text" id="newtheme" placeholder="{{ ui.theme_placeholder }}" autocomplete="off" enterkeyhint="done" list="themelist">
    <datalist id="themelist"></datalist>
    <button type="submit" class="primary">{{ ui.add }}</button>
  </form>
  <ul class="tlist" id="tlist"></ul>
  <p class="hint" id="nothemes">{{ ui.no_themes }}</p>
  <label class="picklabel" for="pick">{{ ui.suggestions }}</label>
  <select id="pick"></select>
  <label class="switch"><input type="checkbox" id="showlocal"> <span>{{ ui.show_local }}</span></label>
  <div class="aibox"><p class="hint" id="aistate"></p>
    <textarea id="aicode" readonly rows="2"></textarea>
    <button type="button" id="aicopy">{{ ui.ai_copy }}</button></div>
  <div class="row2">
    <button type="button" id="setcancel">{{ ui.cancel }}</button>
    <button type="button" class="primary" id="setsave">{{ ui.save }}</button>
  </div>
  <p class="about">{{ ui.settings_note }} {{ ui.about }}</p>
</dialog>

<script type="application/json" id="nd-data">{{ {
  "stories": e.stories, "themes": e.themes, "judged": e.judged or [], "labels": ui.topics, "country": country_name, "lang": lang,
  "t": {"top": ui.top, "local": ui.local, "empty": ui.empty_theme, "read": ui.read_full, "covered": ui.covered_by,
        "one": ui.sources_one, "many": ui.sources_many, "single": ui.single_source, "count": ui.theme_count, "count1": ui.theme_count_one,
        "remove": ui.remove, "showmore": ui.show_more, "showless": ui.show_less, "refine": ui.refine, "mustl": ui.must_label, "notl": ui.not_label,
        "mustph": ui.must_ph, "notph": ui.not_ph, "addword": ui.add_word, "ai": ui.ai_note, "pickone": ui.pick_one, "popular": ui.popular, "alltopics": ui.all_topics, "up": ui.move_up, "down": ui.move_down, "pick": ui.pick_themes, "pickbtn": ui.pick_themes_btn,
        "aion": ui.ai_on, "aioff": ui.ai_off, "aicopied": ui.ai_copied}
}|tojson }}</script>

<script>
(function () {
  var D = JSON.parse(document.getElementById("nd-data").textContent), T = D.t, TH = D.themes;
  var PREF_KEY = "newsdesk-prefs-v2";
  var tabsEl = document.getElementById("tabs"), pager = document.getElementById("pager");
  var current = 0, tabs = [];

  // ---------- preferences (saved on this device) ----------
  function load() {
    try {
      var p = JSON.parse(localStorage.getItem(PREF_KEY));
      if (p && p.v === 2 && Array.isArray(p.themes)) return p;
    } catch (e) {}
    return null;
  }
  function save(p) { try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) {} }
  function asTheme(t) {
    return typeof t === "string" ? { label: t, must: [], not: [] }
      : { label: t.label, must: t.must || [], not: t.not || [] };
  }
  var firstRun = !load();
  var prefs = load() || { v: 2, themes: [], local: true };
  prefs.themes = prefs.themes.map(asTheme);

  // ---------- text helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  var STOP = {};
  ("de del la el los las lo y e o en a al con para por un una unos unas sobre que se su sus mas " +
   "the of and or in on at to for with a an about from news noticias tema temas todo").split(" ").forEach(function (w) { STOP[w] = 1; });
  function words(text) { return norm(text).split(/[^a-z0-9]+/).filter(function (w) { return w.length > 1 && !STOP[w]; }); }
  function stem(w) { return w.slice(0, 5); }
  var rxCache = {};
  function rx(k) {
    return rxCache[k] || (rxCache[k] = new RegExp("(^|[^a-z0-9])" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])"));
  }
  function weight(i) { return Math.max(0.4, 1 - 0.1 * i); }
  function isSoft(s) { return TH.soft_topics.indexOf(s.topic) >= 0; }

  D.stories.forEach(function (s, i) {
    var titles = s.title + " " + s.sources.map(function (x) { return x.title; }).join(" ");
    s.id = i;
    s.titleN = norm(titles);
    s.text = norm(titles + " " + s.summary);
    s.titleStems = {}; words(titles).forEach(function (w) { s.titleStems[stem(w)] = 1; });
    s.textStems = {}; words(s.text).forEach(function (w) { s.textStems[stem(w)] = 1; });
  });

  // ---------- turning a typed theme into a matcher ----------
  var aliases = [];  // [normalized alias, part]
  TH.concepts.forEach(function (c) {
    c.names.concat([c.label]).forEach(function (n) { aliases.push([words(n).join(" "), { type: "concept", c: c }]); });
  });
  TH.country_names.forEach(function (n) { aliases.push([words(n).join(" "), { type: "country" }]); });
  aliases = aliases.filter(function (a) { return a[0]; });
  aliases.sort(function (a, b) { return b[0].length - a[0].length; });

  function compile(label) {
    var t = " " + words(label).join(" ") + " ", parts = [];
    aliases.forEach(function (a) {
      if (t.indexOf(" " + a[0] + " ") >= 0) { parts.push(a[1]); t = t.replace(" " + a[0] + " ", " "); }
    });
    t.trim().split(" ").filter(Boolean).forEach(function (w) { parts.push({ type: "word", stem: stem(w) }); });
    if (!parts.length) parts.push({ type: "phrase", p: norm(label).trim() });
    return parts;
  }
  function kwScore(s, kws) {
    var inT = 0, inB = 0;
    kws.forEach(function (k) { if (rx(k).test(s.titleN)) inT++; else if (rx(k).test(s.text)) inB++; });
    return Math.min(1, 0.5 * inT + 0.15 * Math.min(2, inB));
  }
  function partScore(s, p) {
    if (p.type === "concept") {
      var c = p.c, topic = (s.topics && c.topic && s.topics[c.topic]) || 0;
      if (c.must && c.must.length && !anyWord(s, c.must, c.strict)) return 0;
      if (c.not && c.not.length && anyWord(s, c.not, c.strict)) return 0;
      if (c.id === c.topic) return Math.max(topic, c.keywords.length ? kwScore(s, c.keywords) : 0);
      var kw = kwScore(s, c.keywords);
      if (c.strict && kw < 0.5) return 0;   // the AI word must be in the headline
      return kw ? Math.min(1, kw + 0.2 * topic) : 0;   // e.g. AI: an AI word is needed, being tech helps
    }
    if (p.type === "country") return s.local ? 1 : (TH.country_names.some(function (n) { return rx(n).test(s.text); }) ? 0.6 : 0);
    if (p.type === "word") return s.titleStems[p.stem] ? 1 : (s.textStems[p.stem] ? 0.6 : 0);
    return rx(p.p).test(s.titleN) ? 1 : (rx(p.p).test(s.text) ? 0.5 : 0);
  }
  function anyWord(s, list, titleOnly) {
    var t = titleOnly ? s.titleN : s.text;
    return list.some(function (k) { k = norm(k).trim(); return k && rx(k).test(t); });
  }
  var scoreCache = {};
  function themeKey(label) { return norm(label).split(/[^a-z0-9]+/).filter(Boolean).join(" "); }
  function themeScore(s, th) {
    var key = JSON.stringify(th) + "\u0000" + s.id;
    if (key in scoreCache) return scoreCache[key];
    var parts = compileCache[th.label] || (compileCache[th.label] = compile(th.label));
    var sc = 1, fit = (s.fits || {})[themeKey(th.label)];
    if (fit === 0 || fit === 1) sc = fit;   // the AI filter read the story (judge.py)
    else if (fit === undefined && D.judged.indexOf(themeKey(th.label)) >= 0) sc = 0;   // not even a candidate
    else parts.forEach(function (p) { sc = Math.min(sc, partScore(s, p)); });   // every part must match
    if (th.must.length && !anyWord(s, th.must)) sc = 0;                      // "only if it mentions"
    if (th.not.length && anyWord(s, th.not)) sc = 0;                         // "exclude"
    return (scoreCache[key] = sc);
  }
  var compileCache = {};
  function matches(th) {
    return D.stories.filter(function (s) { return themeScore(s, th) >= 0.45; })
      .sort(function (a, b) { return b.base * (0.5 + themeScore(b, th)) - a.base * (0.5 + themeScore(a, th)); });
  }

  // ---------- which stories go in each tab ----------
  function buildTabs() {
    var best = {};
    D.stories.forEach(function (s) {
      var b = 0;
      prefs.themes.forEach(function (th, i) { var sc = themeScore(s, th); if (sc >= 0.45) b = Math.max(b, weight(i) * sc); });
      best[s.id] = b;
    });
    var pool = D.stories.filter(function (s) {
      return prefs.themes.length ? best[s.id] > 0 || (s.outlets.length >= 3 && !isSoft(s)) : !isSoft(s);
    });
    var score = function (s) { return s.base * (0.4 + s.fixed + best[s.id]); };
    var ranked = pool.slice().sort(function (a, b) { return score(b) - score(a); });
    var top = [], perTopic = {};
    ranked.forEach(function (s) {
      if (top.length >= 10 || s.outlets.length < 2) return;
      var k = s.topic || "-";
      if ((perTopic[k] || 0) >= 3) return;
      perTopic[k] = (perTopic[k] || 0) + 1; top.push(s);
    });
    ranked.forEach(function (s) { if (top.length < 10 && top.indexOf(s) < 0 && !s.hype) top.push(s); });

    var out = [{ id: "top", label: T.top, items: top, prompt: !prefs.themes.length }];
    if (prefs.local) {
      var loc = D.stories.filter(function (s) { return s.local && !isSoft(s); })
        .sort(function (a, b) { return score(b) - score(a); }).slice(0, 12);
      if (loc.length) out.push({ id: "local", label: T.local, items: loc });
    }
    prefs.themes.forEach(function (th) { out.push({ id: "th", label: th.label, items: matches(th).slice(0, 15) }); });
    return out;
  }

  // ---------- rendering ----------
  function label(name) { return D.labels[name] || name; }
  function img(src) {
    return src ? '<img src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : "";
  }
  function card(s, extra) {   // extra: hidden until "Ver más"
    var n = s.outlets.length;
    var kick = (s.topic ? '<span class="t">' + esc(label(s.topic)) + "</span>" : "")
      + (s.local ? '<span class="loc" title="' + esc(D.country) + '" aria-label="' + esc(D.country) + '">📍</span>' : "")
      + '<time class="rel" datetime="' + esc(s.published) + '"></time>'
      + (n > 1 ? "<span>" + esc(T.many.replace("{n}", n)) + "</span>" : '<span class="single">' + esc(T.single) + "</span>");
    var srcs = s.sources.map(function (x) {
      return '<a href="' + esc(x.link) + '" target="_blank" rel="noopener" title="' + esc(x.title) + '">'
        + esc(x.outlet) + (x.lang !== D.lang ? " (" + esc(x.lang) + ")" : "") + "</a>";
    }).join("");
    var head = '<div class="kick">' + kick + "</div><h3>" + esc(s.title) + "</h3>"
      + (s.summary ? '<p class="lede">' + esc(s.summary) + "</p>" : "");
    return '<article class="card brief' + (extra ? " extra" : "") + '">'
      + '<button class="row" type="button" aria-expanded="false"><div>' + head + "</div>"
      + (s.image ? '<div class="thumb">' + img(s.image) + "</div>" : "") + "</button>"
      + '<div class="more">' + (s.summary ? "<p>" + esc(s.summary) + "</p>" : "")
      + (s.ai ? '<div class="ai">✎ ' + esc(T.ai) + "</div>" : "")
      + '<div class="cov">' + esc(T.covered) + ":</div>"
      + '<div class="srcs">' + srcs + "</div>"
      + '<a class="read" href="' + esc(s.link) + '" target="_blank" rel="noopener">' + esc(T.read) + " →</a></div>"
      + "</article>";
  }
  var SHOWN = 4;   // the 4 most important stories of each tab; the rest open with "Ver más"
  function render() {
    scoreCache = {}; compileCache = {};
    tabs = buildTabs();
    tabsEl.innerHTML = tabs.map(function (t, i) {
      return '<button class="tab" role="tab" type="button" id="tab-' + i + '" aria-controls="panel-' + i
        + '" aria-selected="false" data-i="' + i + '">' + esc(t.label) + "</button>";
    }).join("");
    pager.innerHTML = tabs.map(function (t, i) {
      return '<section class="panel" role="tabpanel" id="panel-' + i + '" aria-labelledby="tab-' + i + '">'
        + (t.prompt ? '<div class="pick"><p>' + esc(T.pick) + '</p><button type="button" class="read pickbtn">'
                      + esc(T.pickbtn) + "</button></div>" : "")
        + (t.items.length
            ? '<div class="briefs">' + t.items.map(function (s, j) { return card(s, j >= SHOWN); }).join("") + "</div>"
              + (t.items.length > SHOWN ? '<button type="button" class="moreall" aria-expanded="false" data-n="'
                 + (t.items.length - SHOWN) + '">' + esc(T.showmore.replace("{n}", t.items.length - SHOWN)) + "</button>" : "")
            : '<p class="empty">' + esc(T.empty) + "</p>")
        + "</section>";
    }).join("");
    current = Math.min(current, tabs.length - 1);
    pager.scrollLeft = current * pager.clientWidth;
    setActive(current);
    tick();
  }

  // ---------- tabs <-> swipe ----------
  function setActive(i) {
    current = i;
    Array.prototype.forEach.call(tabsEl.children, function (b, j) { b.setAttribute("aria-selected", j === i ? "true" : "false"); });
    var b = tabsEl.children[i];
    if (b) tabsEl.scrollTo({ left: b.offsetLeft - (tabsEl.clientWidth - b.offsetWidth) / 2, behavior: "smooth" });
  }
  function go(i, smooth) {
    pager.scrollTo({ left: i * pager.clientWidth, behavior: smooth === false ? "auto" : "smooth" });
    setActive(i);
  }
  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest(".tab");
    if (b) go(+b.dataset.i);
  });
  var raf = 0;
  pager.addEventListener("scroll", function () {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      var i = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
      if (i !== current) setActive(i);
    });
  }, { passive: true });
  window.addEventListener("resize", function () { pager.scrollLeft = current * pager.clientWidth; });
  document.addEventListener("keydown", function (ev) {
    if (document.querySelector("dialog[open]") || /input|textarea/i.test((ev.target || {}).tagName)) return;
    if (ev.key === "ArrowRight" && current < tabs.length - 1) go(current + 1);
    if (ev.key === "ArrowLeft" && current > 0) go(current - 1);
  });

  // Tap a story to open its summary and sources (tap again to close).
  pager.addEventListener("click", function (ev) {
    if (ev.target.closest(".pickbtn")) { openSettings(); return; }
    var more = ev.target.closest(".moreall");
    if (more) {
      var panel = more.closest(".panel"), open = !panel.classList.contains("expanded");
      panel.classList.toggle("expanded", open);
      more.setAttribute("aria-expanded", open ? "true" : "false");
      more.textContent = open ? T.showless : T.showmore.replace("{n}", more.dataset.n);
      if (!open) panel.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    var row = ev.target.closest(".row");
    if (!row) return;
    var c = row.parentNode, open = !c.classList.contains("open");
    c.classList.toggle("open", open);
    row.setAttribute("aria-expanded", open ? "true" : "false");
  });

  // ---------- relative times ----------
  var rtf = new Intl.RelativeTimeFormat(D.lang, { numeric: "auto" });
  function rel(iso) {
    var mins = Math.round((new Date(iso) - Date.now()) / 60000);
    if (Math.abs(mins) < 60) return rtf.format(mins, "minute");
    var hrs = Math.round(mins / 60);
    if (Math.abs(hrs) < 48) return rtf.format(hrs, "hour");
    return rtf.format(Math.round(hrs / 24), "day");
  }
  function tick() {
    document.querySelectorAll("time.rel").forEach(function (t) { t.textContent = rel(t.getAttribute("datetime")); });
  }
  setInterval(tick, 60000);
  try {
    var today = new Intl.DateTimeFormat(D.lang, { weekday: "long", day: "numeric", month: "long" }).format(new Date());
    document.getElementById("today").textContent = today;
  } catch (e) {}

  // ---------- refresh ----------
  var loaded = Date.now();
  function reload() { document.getElementById("refresh").classList.add("spin"); location.reload(); }
  document.getElementById("refresh").addEventListener("click", reload);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - loaded > 15 * 60000) reload();
  });

  // ---------- choosing themes ----------
  var dlg = document.getElementById("setdlg"), list = document.getElementById("tlist"), draft;
  var input = document.getElementById("newtheme");
  function has(label) { return draft.themes.some(function (x) { return norm(x.label) === norm(label); }); }
  function suggestWords(th) {
    var out = [];
    (compileCache[th.label] || compile(th.label)).forEach(function (p) {
      if (p.type === "concept") out = out.concat(p.c.must || [], p.c.keywords);
    });
    var seen = {};
    return out.filter(function (w) {
      if (seen[w] || th.must.indexOf(w) >= 0) return false;
      return (seen[w] = true);
    }).slice(0, 60);
  }
  function editor(th, i) {
    var sugg = suggestWords(th);
    return '<li class="ed" data-i="' + i + '">'
      + '<label>' + esc(T.mustl) + '<input type="text" class="must" value="' + esc(th.must.join(", ")) + '" placeholder="' + esc(T.mustph) + '"></label>'
      + (sugg.length ? '<select class="addword"><option value="">' + esc(T.addword) + "</option>"
          + sugg.map(function (w) { return '<option value="' + esc(w) + '">' + esc(w) + "</option>"; }).join("") + "</select>" : "")
      + '<label>' + esc(T.notl) + '<input type="text" class="not" value="' + esc(th.not.join(", ")) + '" placeholder="' + esc(T.notph) + '"></label>'
      + "</li>";
  }
  function drawSettings() {
    list.innerHTML = draft.themes.map(function (th, i) {
      var n = matches(th).length, refined = th.must.length || th.not.length;
      return '<li data-i="' + i + '"><span class="tl"><span>' + esc(th.label) + (refined ? " ✎" : "") + '</span><small>'
        + esc(n === 1 ? T.count1 : T.count.replace("{n}", n)) + "</small></span>"
        + '<button type="button" class="mv ed-btn" aria-label="' + esc(T.refine) + '" aria-expanded="' + (draft.edit === i) + '">✎</button>'
        + '<button type="button" class="mv up" aria-label="' + esc(T.up) + '"' + (i === 0 ? " disabled" : "") + ">↑</button>"
        + '<button type="button" class="mv dn" aria-label="' + esc(T.down) + '"' + (i === draft.themes.length - 1 ? " disabled" : "") + ">↓</button>"
        + '<button type="button" class="mv rm" aria-label="' + esc(T.remove) + '">✕</button></li>'
        + (draft.edit === i ? editor(th, i) : "");
    }).join("");
    list.hidden = !draft.themes.length;
    var on = draft.themes.length && draft.themes.every(function (t) { return D.judged.indexOf(themeKey(t.label)) >= 0; });
    document.querySelector(".aibox").classList.toggle("on", !!on);
    document.getElementById("aistate").textContent = draft.themes.length ? (on ? T.aion : T.aioff) : "";
    document.getElementById("aicode").value = draft.themes.map(function (t) { return t.label; }).join("\n");
    document.querySelector(".aibox").hidden = !draft.themes.length;
    document.getElementById("nothemes").hidden = !!draft.themes.length;
    var opt = function (l) { return '<option value="' + esc(l) + '"' + (has(l) ? " disabled" : "") + ">" + esc(l) + "</option>"; };
    var rest = TH.all.filter(function (l) { return TH.suggested.indexOf(l) < 0; });
    pick.innerHTML = '<option value="">' + esc(T.pickone) + "</option>"
      + '<optgroup label="' + esc(T.popular) + '">' + TH.suggested.map(opt).join("") + "</optgroup>"
      + '<optgroup label="' + esc(T.alltopics) + '">' + rest.map(opt).join("") + "</optgroup>";
    document.getElementById("themelist").innerHTML = TH.all.filter(function (l) { return !has(l); })
      .map(function (l) { return '<option value="' + esc(l) + '"></option>'; }).join("");
  }
  function addTheme(th) {
    th = th.trim().replace(/\s+/g, " ");
    if (!th || has(th)) return;
    draft.themes.push({ label: th.charAt(0).toUpperCase() + th.slice(1), must: [], not: [] });
    drawSettings();
  }
  function openSettings() {
    draft = { themes: prefs.themes.map(asTheme), edit: -1 };
    document.getElementById("showlocal").checked = !!prefs.local;
    input.value = "";
    drawSettings();
    dlg.showModal();
  }
  document.getElementById("gear").addEventListener("click", openSettings);
  document.getElementById("addform").addEventListener("submit", function (ev) {
    ev.preventDefault(); addTheme(input.value); input.value = "";
  });
  var pick = document.getElementById("pick");
  pick.addEventListener("change", function () {
    if (pick.value) addTheme(pick.value);
    pick.value = "";
  });
  function splitWords(v) { return v.split(",").map(function (w) { return w.trim(); }).filter(Boolean); }
  list.addEventListener("change", function (ev) {
    var li = ev.target.closest("li.ed");
    if (!li) return;
    var th = draft.themes[+li.dataset.i];
    if (ev.target.classList.contains("addword") && ev.target.value) th.must.push(ev.target.value);
    else if (ev.target.classList.contains("must")) th.must = splitWords(ev.target.value);
    else if (ev.target.classList.contains("not")) th.not = splitWords(ev.target.value);
    drawSettings();
  });
  list.addEventListener("click", function (ev) {
    var li = ev.target.closest("li");
    if (!li || li.classList.contains("ed")) return;
    var i = +li.dataset.i, th = draft.themes;
    if (ev.target.closest(".ed-btn")) { draft.edit = draft.edit === i ? -1 : i; drawSettings(); return; }
    if (draft.edit >= 0) draft.edit = -1;
    if (ev.target.closest(".up") && i > 0) th.splice(i - 1, 0, th.splice(i, 1)[0]);
    else if (ev.target.closest(".dn") && i < th.length - 1) th.splice(i + 1, 0, th.splice(i, 1)[0]);
    else if (ev.target.closest(".rm")) th.splice(i, 1);
    else return;
    drawSettings();
  });
  document.getElementById("setsave").addEventListener("click", function () {
    if (input.value.trim()) addTheme(input.value);   // typed but didn't press "Add"
    var ed = list.querySelector("li.ed");             // edits not yet confirmed with "done"
    if (ed) {
      var th = draft.themes[+ed.dataset.i];
      th.must = splitWords(ed.querySelector(".must").value);
      th.not = splitWords(ed.querySelector(".not").value);
    }
    prefs = { v: 2, themes: draft.themes, local: document.getElementById("showlocal").checked };
    save(prefs); dlg.close(); current = 0; render(); go(0, false);
  });
  var aicopy = document.getElementById("aicopy"), aicode = document.getElementById("aicode");
  aicopy.addEventListener("click", function () {
    var done = function () { aicopy.textContent = T.aicopied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(aicode.value).then(done, function () { aicode.select(); document.execCommand("copy"); done(); });
    } else { aicode.select(); document.execCommand("copy"); done(); }
  });
  document.getElementById("setcancel").addEventListener("click", function () { dlg.close(); });

  render();
  if (firstRun) openSettings();
})();
</script>

</body>
