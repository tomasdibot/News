name: Newsdesk

on:
  schedule:
    # Hourly rebuild so the site stays fresh.
    - cron: "7 * * * *"
    # Daily reminder (phone notification). Cron is in UTC: 10:45 UTC = 07:45 in Buenos Aires.
    # GitHub often starts scheduled runs 5-15 min late, so aim a bit early.
    # If you change this line, change NOTIFY_CRON below to the same value.
    - cron: "45 10 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Also send the daily reminder now"
        type: boolean
        default: false

env:
  NOTIFY_CRON: "45 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  models: read      # free neutral titles with GitHub Models

concurrency:
  group: newsdesk
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Free neutral titles: a small open model (Qwen2.5 3B) run by Ollama on this machine.
      # The model files are cached, so they are downloaded only once.
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b

      - name: Start local AI model
        id: llm
        continue-on-error: true   # if it fails, the edition is built with cleaned-up original headlines
        timeout-minutes: 8
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_MODELS="$HOME/.ollama/models"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b
          ollama list | grep -q "qwen2.5:3b"
          echo "NEWSDESK_LOCAL_MODEL=qwen2.5:3b" >> "$GITHUB_ENV"

      # Neutral titles already written in earlier runs (so each story is paid for once).
      - uses: actions/cache@v4
        with:
          path: build/neutral-cache.json
          key: neutral-${{ github.run_id }}
          restore-keys: neutral-

      # AI theme filter verdicts from earlier runs (each story is read once per theme).
      - uses: actions/cache@v4
        with:
          path: build/theme-cache.json
          key: themes-${{ github.run_id }}
          restore-keys: themes-

      - name: Build edition
        run: python -m newsdesk build
        env:
          NEWSDESK_PROFILE: ${{ secrets.NEWSDESK_PROFILE }}
          # The page is encrypted with this password. The build fails rather than
          # publish an unprotected page if the secret is missing.
          NEWSDESK_PASSWORD: ${{ secrets.NEWSDESK_PASSWORD }}
          NEWSDESK_REQUIRE_PASSWORD: "1"
          NEWSDESK_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          # Neutral titles (config.yaml → neutral_titles): free via GitHub Models with the
          # built-in token, or Claude if the optional ANTHROPIC_API_KEY secret exists.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Your themes, one per line, sent by the app (⚙ → Connect GitHub): the AI keeps only
          # the stories that fit each one exactly.
          NEWSDESK_THEMES: ${{ vars.NEWSDESK_THEMES || secrets.NEWSDESK_THEMES }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send daily reminder
        if: github.event.schedule == env.NOTIFY_CRON || inputs.notify
        run: python -m newsdesk notify
        env:
          NEWSDESK_PROFILE: ${{ secrets.NEWSDESK_PROFILE }}
          NEWSDESK_PASSWORD: ${{ secrets.NEWSDESK_PASSWORD }}
          NEWSDESK_REQUIRE_PASSWORD: "1"
          NEWSDESK_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          NEWSDESK_NOTIFY_PROVIDER: ${{ vars.NEWSDESK_NOTIFY_PROVIDER }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Only needed for the optional WhatsApp providers:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          GREENAPI_API_URL: ${{ secrets.GREENAPI_API_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
