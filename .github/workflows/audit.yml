name: Check AI theme filter

# Run by hand (Actions → "Check AI theme filter" → Run workflow). It only prints a report:
# the model's answers on example stories with known answers, and on today's real news,
# for the themes the app sent (NEWSDESK_THEMES). Nothing is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b

      - name: Start local AI model
        timeout-minutes: 8
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_MODELS="$HOME/.ollama/models"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b
          echo "NEWSDESK_LOCAL_MODEL=qwen2.5:3b" >> "$GITHUB_ENV"

      - name: Check the filter
        run: python -m newsdesk audit
        env:
          NEWSDESK_PROFILE: ${{ secrets.NEWSDESK_PROFILE }}
          NEWSDESK_THEMES: ${{ vars.NEWSDESK_THEMES || secrets.NEWSDESK_THEMES }}
