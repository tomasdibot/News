# ---------------------------------------------------------------------------
# News sources.
#
# Selection criteria: wire services, public broadcasters and large general
# outlets with a straight-news (not opinion) focus. For a country we
# deliberately include outlets from DIFFERENT editorial lines: a story only
# ranks high when several of them independently cover it, so the slant of
# any one outlet carries little weight.
#
#   outlet  - outlets with the same name count as ONE voice (BBC World + BBC
#             Mundo is still just "BBC" when counting coverage).
#   region  - "global" feeds are always used; country feeds (AR, ES, MX, US...)
#             are used only when they match profile.country.
#   tier    - wire | public | commercial | institutional (sets trust weight)
#   lean    - optional editorial lean: left, center-left, center, center-right, right
#             (empty = unknown). Approximate and editable by the owner; based on
#             academic studies (arXiv 2310.08701) and Media Bias/Fact Check.
#   topics  - optional hint for section feeds (business, science, ...)
#
# Run `python -m newsdesk check-feeds` to see which feeds respond.
# ---------------------------------------------------------------------------

# --- Global, English -------------------------------------------------------
- { id: bbc-world,     outlet: BBC,        lang: en, region: global, tier: public, url: "https://feeds.bbci.co.uk/news/world/rss.xml", topics: [world], lean: center }
